name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build desktop components
        shell: powershell
        run: .\scripts\Build.ps1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check PowerShell scripts
        shell: powershell
        run: .\scripts\Check.ps1
